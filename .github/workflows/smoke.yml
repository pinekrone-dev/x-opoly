# Proves the deployed app really loads: opens it in a headless browser on a
# GitHub runner, checks the OpenStreetMap basemap paints, and uploads a
# screenshot. Runs after a push (Cloudflare's Git integration deploys on the
# same push) and on demand from the Actions tab.
#
# No secrets needed — it only talks to the public URL.

name: Smoke test the deployment

on:
  push:
    branches:
      - main
      - claude/sitemapcre-tool-clone-qyq7jy
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to test (blank tests both public addresses)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Both public addresses reach the same Worker, but only testing one would
    # miss a custom domain whose route or certificate has not come up.
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://survey.realestateaistudio.com
          - https://x-opoly.shiny-butterfly-2b90.workers.dev

    env:
      SMOKE_URL: ${{ github.event.inputs.url || matrix.url }}
      # Secrets are not ambient in Actions — a workflow only sees the ones it
      # names. Without these two lines the smoke test kept reporting "add the
      # secrets" after they had been added.
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      # Production now deploys only after the staging gate in deploy.yml
      # holds, so this commit reaches the live site several minutes later
      # than the push. The default waits were tuned for a deploy that raced
      # the push and would time out on the gated one.
      COMMIT_WAIT_MS: '900000'
      DEPLOY_WAIT_MS: '900000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install a browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # Build locally so the deploy wait has this commit's bundle hash to
      # compare against.
      - run: npm run build

      # Cloudflare deploys from the same push, so the new version may still be
      # rolling out. Polling /api/health for a 200 is not enough — the previous
      # deployment answers 200 too, so the run would race the rollout and
      # report the old build as verified.
      - name: Wait for this commit to be live
        run: node scripts/wait-for-deploy.mjs "$SMOKE_URL"

      - name: Run the smoke test
        run: node scripts/smoke.mjs "$SMOKE_URL"

      - name: Upload the map screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots-${{ strategy.job-index }}
          path: |
            smoke-map.png
            smoke-book.png
            smoke-gis.png
          if-no-files-found: warn
