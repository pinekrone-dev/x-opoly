# Deploys the Worker from GitHub, so no terminal is needed.
#
# One-time setup, all in the browser:
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token
#      → use the "Edit Cloudflare Workers" template. Copy the token.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions
#      → New repository secret, twice:
#         CLOUDFLARE_API_TOKEN   the token from step 1
#         CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages,
#                                the Account ID shown in the right sidebar
#   3. GitHub → Actions tab → "Deploy to Cloudflare" → Run workflow.
#
# After that it deploys on every push to this branch.
#
# ANTHROPIC_API_KEY is deliberately NOT set here. Add it once in the
# Cloudflare dashboard (Workers & Pages → sitesurvey-cre → Settings →
# Variables and Secrets → Add, type "Secret"), so the key lives only in
# Cloudflare rather than in GitHub as well.

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - claude/sitemapcre-tool-clone-qyq7jy
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # The `secrets` context is not available in a step's `if`, so a condition
      # written against it is a syntax error that kills the whole run before
      # any job starts. Reduce the secret to a yes/no here — in a step that
      # holds it and nothing else — and branch on that instead.
      - name: Is a deploy token configured?
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A broken build should never reach production.
      - run: npm test

      - run: npm run build

      # Cloudflare's own Git integration also deploys this repo, so the API
      # token here is optional. Without it, this workflow still builds and
      # tests every push; it just does not deploy, rather than failing red on
      # a secret that was never meant to exist.
      - name: Deploy the Worker
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Note that deploying was skipped
        if: steps.token.outputs.present == 'false'
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so this run built and tested"
          echo "the app but did not deploy it."
          echo
          echo "That is fine if Cloudflare's Git integration is connected to"
          echo "this repo, which deploys on push without any token here."
          echo "To deploy from GitHub instead, add the two repository secrets"
          echo "described at the top of this file."
