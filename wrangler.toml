# Named after the Worker the Cloudflare Git integration created, which takes
# its name from the repository. To rename, change it in the dashboard and here
# together — otherwise a deploy creates a second Worker beside the running one.
name = "x-opoly"
main = "worker/index.js"
compatibility_date = "2026-06-01"

# The Anthropic SDK relies on Node compatibility shims. It is imported lazily
# so the rest of the app never depends on it, but reading a flyer does.
compatibility_flags = ["nodejs_compat"]

# Serve on the *.workers.dev subdomain. Explicit because a Worker created
# through the dashboard can have this route switched off, which returns
# Cloudflare's "nothing here yet" page even though the deploy succeeded.
workers_dev = true

# The public address. `custom_domain` makes the deploy provision the DNS record
# and certificate itself, so nothing has to be created in the dashboard — but
# it requires the domain to be a zone in this same Cloudflare account. If a
# deploy ever fails naming a route, that is what to check. The *.workers.dev
# address above keeps working either way.
[[routes]]
pattern = "survey.realestateaistudio.com"
custom_domain = true

# The new canonical home. Cloudflare provisions the DNS records and
# certificates for both of these on deploy, so nothing is created by hand —
# and a record added manually would block it, since a custom domain cannot be
# attached to a hostname that already has one.
#
# Custom domains match the hostname exactly, so the apex and www each need
# their own entry; the worker then 301s www to the bare name, keeping path
# and query. Nothing else in the app changes: every link it builds —
# verification emails, Stripe return URLs, client share links — is derived
# from the host the request arrived on.
# HELD BACK: landquotient.com is registered through Cloudflare Registrar in a
# different account (pinekrone@gmail.com) than the one running this Worker. A
# custom domain can only name a zone its own account holds, so enabling these
# now fails the Cloudflare build and the site keeps serving the previous
# deployment — silently, because a wrangler.toml-only change leaves the bundle
# hash untouched and the smoke test's rollout check has nothing to notice.
#
# The fix is an inter-account registrar transfer, which Cloudflare only allows
# once the domain is more than 10 days old. Registered 2026-08-25, so eligible
# from about 2026-09-04. Leave DNSSEC off until then — it blocks the move.
# Re-enable both blocks once the zone and this Worker are in one account.
#
# [[routes]]
# pattern = "landquotient.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.landquotient.com"
# custom_domain = true

# The built frontend. `single-page-application` makes deep links such as
# /survey/:id and /s/:token resolve to index.html instead of a 404.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Provisioned in the Cloudflare account, region ENAM. Tables already created.
[[d1_databases]]
binding = "DB"
database_name = "sitesurvey-cre"
database_id = "40bf42da-08df-46bb-ad73-de084621ebc4"
migrations_dir = "migrations"

# Provisioned in the Cloudflare account, region ENAM.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sitesurvey-cre-uploads"

[vars]
# Basemap: any of osm, carto-voyager, carto-light, carto-dark, satellite.
# All are keyless. The keyed providers (mapbox, here, maptiler) also need
# TILE_KEY, which is a secret and so is not set here.
#
# Carto rather than OpenStreetMap's own tiles. OSM's usage policy asks that
# their servers not be the basemap for a product, and they are entitled to
# throttle or block an origin at any time without telling it — which from
# inside the app is indistinguishable from a map that simply does not draw.
# Carto serves the same OSM data, keyless, and is what Prospector already
# runs on. The switcher still offers OSM to anyone who wants it.
TILE_PROVIDER = "carto-light"

# Secrets are NOT set here — they would end up in git. Set them in the
# dashboard under Settings -> Variables and Secrets, or with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# Optional, and all optional on purpose — every feature has a free default:
#   ANTHROPIC_API_KEY  reading a flyer with AI
#   GOOGLE_MAPS_API_KEY  Google routing and Places, instead of OSRM/Overpass
#   CENSUS_API_KEY     raises the ACS rate limit; the data is free either way

# --- staging -----------------------------------------------------------------
#
# A second Worker, on its own database and its own bucket.
#
# A Workers "version preview" would have been cheaper, but it binds to the
# same D1 as production: testing a survey would put rows in the real CRM, and
# a schema change would be tried out on live data. Staging that shares a
# database is not staging. This one is separate down to the storage.
#
# It carries no custom domain on purpose. The *.workers.dev address is the
# whole address, so there is no chance of a staging hostname being handed to a
# client, and no DNS record to clean up when it is thrown away.
#
# Secrets are deliberately not copied across. Every integration in this app is
# optional and degrades to a free default, so staging runs without Stripe,
# without SMS and without an AI key — which is also the safest way for it to
# run, since nothing here can charge a card or send a text to a real person.
[env.staging]
name = "landquotient-staging"
workers_dev = true

# Empty, and it MUST be empty. A named environment inherits the top-level
# `routes`, so leaving this out does not mean "no routes" — it means staging
# claims survey.realestateaistudio.com and serves it, silently taking
# production's traffic on deploy. Found the hard way.
routes = []

[env.staging.vars]
# Carto rather than OpenStreetMap's own tiles. OSM's tile usage policy asks
# that their servers not be used as the basemap for a product, and they are
# entitled to throttle or block an origin at any time without telling it —
# which is indistinguishable, from inside the app, from a map that simply does
# not draw. Carto serves the same OSM data, keyless, and is what Prospector
# already runs on.
TILE_PROVIDER = "carto-light"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sitesurvey-cre-staging"
database_id = "80c534a6-5092-461b-93c4-c8dc19d799f5"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "sitesurvey-cre-uploads-staging"
