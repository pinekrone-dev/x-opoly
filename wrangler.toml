name = "sitesurvey-cre"
main = "worker/index.js"
compatibility_date = "2026-06-01"

# The built frontend. `single-page-application` makes deep links such as
# /survey/:id and /s/:token resolve to index.html instead of a 404.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Provisioned in the Cloudflare account, region ENAM. Tables already created.
[[d1_databases]]
binding = "DB"
database_name = "sitesurvey-cre"
database_id = "40bf42da-08df-46bb-ad73-de084621ebc4"
migrations_dir = "migrations"

# Provisioned in the Cloudflare account, region ENAM.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sitesurvey-cre-uploads"

[vars]
# Basemap: any of osm, carto-voyager, carto-light, carto-dark.
TILE_PROVIDER = "osm"

# Secrets are NOT set here — they would end up in git. Use:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TILE_KEY          (only for a keyed basemap)
