<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Site survey and deal mapping for tenant rep brokers — map candidate properties, track deal stages, plan tours and share a branded map with clients." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Land Quotient — Real Estate Intelligence</title>

    <!--
      Link previews. The absolute URLs a crawler needs cannot be written at
      build time, because the same build is served from more than one domain —
      so the origin below is a placeholder that the server swaps for the host
      the request actually arrived on. Left unswapped it is still a valid,
      live URL rather than a broken one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Land Quotient" />
    <meta property="og:title" content="Land Quotient — Real Estate Intelligence" />
    <meta
      property="og:description"
      content="Market surveys your clients actually open. Map the sites, shade the demographics, plan the tour, and send one polished link."
    />
    <meta property="og:url" content="https://survey.realestateaistudio.com/" />
    <meta property="og:image" content="https://survey.realestateaistudio.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Land Quotient — Real Estate Intelligence" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Land Quotient — Real Estate Intelligence" />
    <meta
      name="twitter:description"
      content="Market surveys your clients actually open. Map the sites, shade the demographics, plan the tour, and send one polished link."
    />
    <meta name="twitter:image" content="https://survey.realestateaistudio.com/og.png" />
    <meta name="theme-color" content="#1B3668" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
